spring:
  application:
    name: testpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/TestPilot}
    username : ${DB_NAME:postgres}
    password : ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

